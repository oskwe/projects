services:
  nginx-server:
    container_name: local-static-server
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - "./html:/usr/share/nginx/html:ro"
      - "./config/nginx:/etc/nginx/conf.d:ro"
    networks:
      - lab-network

  global-echo-server:
    container_name: local-echo-server
    image: mendhak/http-https-echo
    environment:
      - HTTP_PORT=80
    networks:
      - lab-network

# Объявление сети (должно быть в конце файла, на одном уровне с services)
networks:
  lab-network:
    driver: bridge
