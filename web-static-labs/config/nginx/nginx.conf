server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location /lab2/task1/ {

    autoindex on;
    
  }

  # Задание 2: Защита паролем
  location /lab2/task2/secure/ {
    auth_basic "Private Area";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    autoindex on;
  }

  # Задание 3: Закрытый доступ с кастомной страницей 403
  location /lab2/task3/ {
    location = /lab2/task3/403.html {
        internal; 
        root /usr/share/nginx/html;
    }

    return 403;
    
    error_page 403 /lab2/task3/403.html;
  }


  error_page 404 /404.html;

  location = /404.html {
      internal;
      root /usr/share/nginx/html;
  }

  location = /lab2/task5/index.html {
      return 301 /lab2/task5/redirected.html;
  }
  location /whoami/{
        proxy_pass http://global-echo-server/;
        proxy_set_header X-Custom-Group "Myasnikov Nikita Sergeevich, PI2402";
        proxy_set_header Host $host;
    }

location /lab3/task2/profile {
    rewrite ^ /lab3/task2/profiles/myprofile.html break;
  }
  location ~ ^/lab3/task3/items/(\d+)$ { 
       proxy_pass http://global-echo-server/?itemId=$1; 

       proxy_set_header Host $host; 
       proxy_set_header X-Original-URI $request_uri; 
       proxy_set_header X-Rewritten-URI "/?itemId=$1"; 
   }
   location /lab3/task4/ {
    alias /usr/share/nginx/html/lab3/task4/;
    index index.html;
    }
    location /lab3/task5/ {
    alias /usr/share/nginx/html/lab3/task5/;
    index index.html;
    }
    location /lab3/task6/ {
    alias /usr/share/nginx/html/lab3/task6/;
    index index.html;
    }
    location /lab4/{
      autoindex on;
    }
}
