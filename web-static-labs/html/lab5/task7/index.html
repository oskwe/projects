<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab 5 - Task 7: Таблица умножения</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 { text-align: center; color: #333; }

        /* Панель настроек */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-size: 14px; font-weight: bold; color: #555; }
        
        input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 80px;
            font-size: 16px;
        }

        button.create-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            height: 40px;
        }
        button.create-btn:hover { background-color: #0056b3; }

        /* Контейнер таблицы */
        #tableContainer {
            overflow: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-height: 200px;
            display: flex;
            justify-content: center;
        }

        table {
            border-collapse: collapse;
            font-size: 14px;
        }

        td {
            border: 1px solid #ddd;
            width: 40px;
            height: 40px;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        /* Подсветка при наведении */
        td.hover-cell {
            background-color: #fff3cd; /* Желтоватый фон */
            border: 2px solid #ffc107; /* Желтая рамка */
            font-weight: bold;
            transform: scale(1.1); /* Легкое увеличение */
            z-index: 10;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Модальное окно */
        .modal-overlay {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-window {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .modal-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #333;
        }

        .modal-info {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #555;
        }

        .modal-info strong {
            color: #007bff;
        }

        .close-modal-btn {
            padding: 8px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .close-modal-btn:hover { background-color: #218838; }

    </style>
</head>
<body>

    <h1>Таблица умножения</h1>

    <!-- Настройки -->
    <div class="controls">
        <div class="input-group">
            <label for="rowsInput">Строки (1-20):</label>
            <input type="number" id="rowsInput" min="1" max="20" value="5">
        </div>
        <div class="input-group">
            <label for="colsInput">Столбцы (1-20):</label>
            <input type="number" id="colsInput" min="1" max="20" value="5">
        </div>
        <button class="create-btn" onclick="createTable()">Создать таблицу</button>
    </div>

    <!-- Область таблицы -->
    <div id="tableContainer">
        <p style="color:#777; align-self:center;">Нажмите «Создать таблицу», чтобы начать</p>
    </div>

    <!-- Модальное окно -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-window">
            <h2 class="modal-title">Информация о ячейке</h2>
            <div class="modal-info" id="modalContent">
                <!-- Сюда JS вставит текст -->
            </div>
            <button class="close-modal-btn" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        "use strict";

        const rowsInput = document.getElementById('rowsInput');
        const colsInput = document.getElementById('colsInput');
        const tableContainer = document.getElementById('tableContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');

        // 1. Создание таблицы
        function createTable() {
            let rows = parseInt(rowsInput.value);
            let cols = parseInt(colsInput.value);

            // Валидация диапазона (на всякий случай, хотя атрибуты HTML тоже держат)
            if (rows < 1) rows = 1;
            if (rows > 20) rows = 20;
            if (cols < 1) cols = 1;
            if (cols > 20) cols = 20;

            // Обновляем инпуты, если значения были исправлены
            rowsInput.value = rows;
            colsInput.value = cols;

            tableContainer.innerHTML = ''; // Очистка контейнера

            const table = document.createElement('table');

            for (let i = 1; i <= rows; i++) {
                const tr = document.createElement('tr');
                for (let j = 1; j <= cols; j++) {
                    const td = document.createElement('td');
                    const result = i * j;
                    
                    td.textContent = result;
                    
                    // Сохраняем данные в data-атрибуты для удобства
                    td.dataset.row = i;
                    td.dataset.col = j;
                    td.dataset.result = result;

                    // Навешиваем обработчики событий
                    addCellEvents(td);

                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }

            tableContainer.appendChild(table);
        }

        // 2. Обработчики событий для ячейки
        function addCellEvents(cell) {
            // Подсветка при наведении (Pointer Events универсальны)
            cell.addEventListener('pointerenter', () => {
                cell.classList.add('hover-cell');
            });

            cell.addEventListener('pointerleave', () => {
                cell.classList.remove('hover-cell');
            });

            // Клик для открытия модального окна
            cell.addEventListener('click', () => {
                const r = cell.dataset.row;
                const c = cell.dataset.col;
                const res = cell.dataset.result;

                openModal(r, c, res);
            });
        }

        // 3. Логика модального окна
        function openModal(row, col, result) {
            modalContent.innerHTML = `
                <p>Номер строки: <strong>${row}</strong></p>
                <p>Номер столбца: <strong>${col}</strong></p>
                <p>Результат умножения: <strong>${result}</strong></p>
                <p style="margin-top:10px; font-size:0.9em; color:#777;">(${row} × ${col} = ${result})</p>
            `;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Закрытие модального окна при клике по затемненному фону
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Закрытие по клавише Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // Создаем таблицу по умолчанию при загрузке (опционально)
        // createTable(); 
    </script>
</body>
</html>
