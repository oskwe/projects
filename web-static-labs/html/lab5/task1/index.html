<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab 5 - Task 1</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        
        /* Стили для результата на основной странице */
        #mainResult { margin-top: 20px; font-weight: bold; }

        /* Фон затемнения */
        .overlay {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Само модальное окно */
        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            
            /* Требования к размерам */
            width: 50%;
            min-width: 300px;
            height: 30%;
            min-height: 200px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Поля и кнопки */
        input { padding: 8px; margin: 10px 0; width: 80%; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        
        /* Состояние ошибки */
        .error-border { border: 2px solid red !important; }
        .error-text { color: red; font-size: 0.9em; height: 1.2em; }
        
        /* Класс для отображения окна */
        .overlay.active { display: flex; }
    </style>
</head>
<body>
    <p>ты попал на рассылку</p>
    <p>ждемс</p>

    <!-- Блок для вывода результата на основной странице -->
    <div id="mainResult"></div>

    <!-- Структура модального окна -->
    <div id="overlay" class="overlay">
        <div id="modal" class="modal">
            <h2 id="modalTitle">Подпишитесь на новости сайта</h2>
            <input type="email" id="emailInput" placeholder="Введите ваш e-mail">
            <div id="errorMsg" class="error-text"></div>
            <div id="buttonsBlock">
                <button id="subscribeBtn">Подписаться</button>
                <button id="closeBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // Элементы
        const overlay = document.getElementById('overlay');
        const modal = document.getElementById('modal');
        const emailInput = document.getElementById('emailInput');
        const errorMsg = document.getElementById('errorMsg');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const closeBtn = document.getElementById('closeBtn');
        const modalTitle = document.getElementById('modalTitle');
        const buttonsBlock = document.getElementById('buttonsBlock');
        const mainResult = document.getElementById('mainResult');

        let autoCloseTimer = null;

        // 1. Таймер на 7 секунд после загрузки
        window.addEventListener('load', () => {
            setTimeout(openModal, 7000);
        });

        function openModal() {
            overlay.classList.add('active');
            emailInput.focus();
        }

        function closeModal() {
            overlay.classList.remove('active');
            // Сброс таймера автозакрытия, если он был
            if (autoCloseTimer) clearTimeout(autoCloseTimer);
            // Убираем лишние обработчики
            document.removeEventListener('keydown', handleEsc);
            modal.removeEventListener('click', handleSuccessClick);
        }

        // 2. Логика кнопки "Закрыть"
        closeBtn.addEventListener('click', () => {
            mainResult.textContent = "Подписка не выполнена";
            mainResult.style.color = "black";
            closeModal();
        });

        // 3. Логика кнопки "Подписаться"
        subscribeBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            
            // Простая валидация через встроенные свойства браузера
            if (!email || !emailInput.checkValidity()) {
                // Ошибка
                emailInput.classList.add('error-border');
                if (!email) {
                    errorMsg.textContent = "Поле не может быть пустым";
                } else {
                    errorMsg.textContent = "Введите корректный e-mail";
                }
            } else {
                // Успех
                onSuccess(email);
            }
        });

        function onSuccess(email) {
            // Меняем содержимое окна
            modalTitle.textContent = "Спасибо за подписку!";
            emailInput.style.display = 'none';
            errorMsg.textContent = "";
            buttonsBlock.style.display = 'none';
            
            const successText = document.createElement('p');
            successText.textContent = `На Ваш адрес ${email} будет направлено письмо`;
            modal.appendChild(successText);

            // Вывод на основную страницу
            mainResult.textContent = `Подписка выполнена на ${email}`;
            mainResult.style.color = "green";

            // Автозакрытие через 10 секунд
            autoCloseTimer = setTimeout(closeModal, 10000);

            // Закрытие по клику пользователя (в любом месте окна успеха)
            modal.addEventListener('click', handleSuccessClick);

            // Закрытие по Esc
            document.addEventListener('keydown', handleEsc);
        }

        function handleSuccessClick() {
            closeModal();
        }

        function handleEsc(event) {
            if (event.key === "Escape" || event.key === "Esc") {
                closeModal();
            }
        }

        // Сброс ошибки при вводе
        emailInput.addEventListener('input', () => {
            emailInput.classList.remove('error-border');
            errorMsg.textContent = "";
        });

    </script>
</body>
</html>
