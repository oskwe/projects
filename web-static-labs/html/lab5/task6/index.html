<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab 5 - Task 6: Генератор паролей</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 { text-align: center; color: #333; font-size: 1.5rem; }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Группы элементов */
        .form-group { margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Чекбоксы */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #eee;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: normal;
        }

        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }

        /* Кнопка генерации */
        button.generate-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button.generate-btn:hover { background-color: #0056b3; }

        /* Результат */
        .result-area {
            margin-top: 25px;
            text-align: center;
            display: none; /* Скрыто по умолчанию */
        }
        .result-area.active { display: block; }

        .password-display {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-family: monospace;
            background-color: #e9ecef;
            border: 2px solid #007bff;
            border-radius: 5px;
            color: #333;
            word-break: break-all;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        button.copy-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.copy-btn:hover { background-color: #218838; }

        /* Ошибки */
        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
            text-align: center;
        }
        .error-msg.visible { display: block; }

    </style>
</head>
<body>

    <h1>Генератор паролей</h1>

    <div class="container">
        <!-- Длина пароля -->
        <div class="form-group">
            <label for="passLength">Длина пароля (6-32):</label>
            <input type="number" id="passLength" value="12" min="6" max="32">
        </div>

        <!-- Настройки символов -->
        <div class="form-group">
            <label>Типы символов:</label>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="useLower" checked> Строчные буквы (a-z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="useUpper" checked> Заглавные буквы (A-Z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="useDigits" checked> Цифры (0-9)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="useSpecial"> Спецсимволы (!@#$...)
                </label>
            </div>
        </div>

        <button class="generate-btn" onclick="generatePassword()">Сгенерировать пароль</button>
        <div id="errorMsg" class="error-msg"></div>

        <!-- Область результата -->
        <div id="resultArea" class="result-area">
            <label>Ваш пароль:</label>
            <input type="text" id="passwordOutput" class="password-display" readonly>
            <button class="copy-btn" onclick="copyPassword()">Копировать в буфер</button>
        </div>
    </div>

    <script>
        "use strict";

        // Наборы символов
        const CHARS = {
            lower: 'abcdefghijklmnopqrstuvwxyz',
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            digits: '0123456789',
            special: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        // --- ТВОЯ ФУНКЦИЯ КОПИРОВАНИЯ ---
        function copyToClipboard(text) {
            // Создаём поле
            const textarea = document.createElement('textarea');
            textarea.value = text;
            
            // Важно: скрываем поле за пределами экрана, чтобы не было скачка прокрутки
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '0';
            
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand("copy");
                if (!successful) {
                    alert('Не удалось скопировать текст (команда не поддерживается).');
                }
            } catch (err) {
                console.error('Ошибка копирования: ', err);
                alert('Не удалось скопировать текст.');
            }
            
            document.body.removeChild(textarea);
        }
        // --------------------------------

        // Основная функция генерации
        function generatePassword() {
            const lengthInput = document.getElementById('passLength');
            const useLower = document.getElementById('useLower').checked;
            const useUpper = document.getElementById('useUpper').checked;
            const useDigits = document.getElementById('useDigits').checked;
            const useSpecial = document.getElementById('useSpecial').checked;
            
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const passwordOutput = document.getElementById('passwordOutput');

            // Сброс ошибок
            errorMsg.classList.remove('visible');
            errorMsg.textContent = '';

            // 1. Валидация длины
            let length = parseInt(lengthInput.value);
            if (isNaN(length) || length < 6 || length > 32) {
                showError("Длина пароля должна быть от 6 до 32 символов.");
                return;
            }

            // 2. Валидация выбранных символов
            if (!useLower && !useUpper && !useDigits && !useSpecial) {
                showError("Выберите хотя бы один тип символов!");
                return;
            }

            // Сборка общей строки всех доступных символов
            let allowedChars = '';
            if (useLower) allowedChars += CHARS.lower;
            if (useUpper) allowedChars += CHARS.upper;
            if (useDigits) allowedChars += CHARS.digits;
            if (useSpecial) allowedChars += CHARS.special;

            // Генерация случайной строки
            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * allowedChars.length);
                password += allowedChars[randomIndex];
            }

            // Вывод результата
            passwordOutput.value = password;
            resultArea.classList.add('active');
        }

        // Функция копирования из интерфейса
        function copyPassword() {
            const passwordOutput = document.getElementById('passwordOutput');
            if (passwordOutput.value) {
                // Вызываем твою функцию
                copyToClipboard(passwordOutput.value);
                
                // Визуальное подтверждение
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = "Скопировано!";
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 1500);
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.add('visible');
            document.getElementById('resultArea').classList.remove('active');
        }

    </script>
</body>
</html>
