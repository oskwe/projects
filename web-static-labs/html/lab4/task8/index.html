<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Проверка пароля с индикатором</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
        }
        .indicator {
            display: flex;
            gap: 1px;
            justify-content: center;
            margin: 15px 0;
        }
        .segment {
            width: 10px;
            height: 5px;
            background: #ddd;
        }
        .segment.active {
            background: red;
        }
        .segment.yellow {
            background: yellow;
        }
        .segment.green {
            background: green;
        }
        .result {
            margin-top: 20px;
            font-size: 16px;
        }
        .score {
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h2>Проверка сложности пароля</h2>
    <input type="text" id="passwordInput" placeholder="Введите пароль"/>
    
    <div class="indicator" id="indicator">
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
        <div class="segment"></div>
    </div>
    
    <button id="checkBtn">Проверить</button>
    <div class="result" id="result"></div>

    <script src="password.js" defer></script>
</body>
</html>
