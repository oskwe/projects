<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Задание 3: Цифровые часы</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        
        .clock-container {
            background: white;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .clock {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
        }
        
        .label {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="clock" id="clock">00.00.00</div>
        <div class="label">Текущее время</div>
    </div>

    <script src="clock.js" defer></script>
</body>
</html>
