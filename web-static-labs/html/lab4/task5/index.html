<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Секундомер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .time {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="time" id="display">00:00:00:00</div>
    <button id="startBtn">Старт</button>
    <button id="stopBtn">Стоп</button>
    <button id="resetBtn">Сброс</button>

    <script src="stopwatch.js" defer></script>
</body>
</html>
