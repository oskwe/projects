<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Проверка сложности пароля</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .criteria {
            font-size: 14px;
            line-height: 1.8;
        }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h2>Проверка сложности пароля</h2>
    <input type="text" id="passwordInput" placeholder="Введите пароль"/>
    <br>
    <button id="checkBtn">Проверить</button>
    
    <div class="result" id="result"></div>

    <script src="password.js" defer></script>
</body>
</html>
