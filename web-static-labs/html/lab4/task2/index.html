<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Задание 2. Идентификация платежной карты</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto;
        }
        #cards { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        #cards img { 
            opacity: 0.2; 
            height: 40px; 
            transition: opacity 0.2s ease;
            border: 2px solid transparent;
        }
        #cards img.hl { 
            opacity: 1;
            border-color: #4CAF50;
        }
        .input-group {
            margin: 15px 0;
        }
        input[type="text"] { 
            width: 320px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 4px;
        }
        button { 
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result { 
            margin-top: 15px; 
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .success { 
            background-color: #d4edda; 
            color: #155724;
        }
        .error { 
            background-color: #f8d7da; 
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Проверка платежной карты</h1>
    
    <div id="cards" aria-hidden="true">
        <img src="card-picture/visa.png" id="visa" alt="VISA" title="VISA">
        <img src="card-picture/card.png" id="mc" alt="MasterCard" title="MasterCard">
        <img src="card-picture/payment.png" id="maestro" alt="Maestro" title="Maestro">
        <img src="card-picture/icons8-мир-48.png" id="mir" alt="МИР" title="МИР">
    </div>

    <div class="input-group">
        <input type="text" id="cardNumber" placeholder="Введите 16-ти значный номер карты" maxlength="19"/>
        <button id="cardCheck" type="button">Проверить</button>
    </div>

    <div id="result"></div>

    <script src="cards.js" defer></script>
</body>
</html>
