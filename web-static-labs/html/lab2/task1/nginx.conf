server {
    listen 80;
    server_name localhost;

    # Корень сайта внутри контейнера
    root /usr/share/nginx/html;
    # Файл по умолчанию для директорий
    index index.html;


    # --- МАРШРУТИЗАЦИЯ ЛАБОРАТОРНЫХ РАБОТ ---

    # Правила для Лабораторной работы №1
    location /lab1/ {
        # внимание! эта директива только для разработки! не используйте в продакшн
        autoindex on; 
   
    }
    location /lab2/{
        autoindex on;

    }
}
