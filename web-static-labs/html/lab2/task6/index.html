<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 6: Макеты в Figma</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }
        .task-block {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .task-block h2 {
            margin-top: 0;
            color: #3498db;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .figma-link {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 20px;
            background-color: yellowgreen;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .screenshot {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: block;
            margin-top: 10px;
        }
        .description {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Отчет по Заданию 6: Макеты в Figma</h1>

    <!-- Блок 1: Десктоп (12 колонок) -->
    <div class="task-block">
        <h2>Макет Desktop (12 колонок)</h2>
        <p class="description">Сетка: 1280px, 12 колонок по 80px, gutter 20px.</p>
        
        <!-- ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА FIGMA ДЛЯ DESKTOP -->
        <a href="https://www.figma.com/design/YyZGeS1QtQc3LhYygjmVBu/Untitled?node-id=155-49" target="_blank" class="figma-link">
            Открыть макет в Figma ↗
        </a>

        <!-- ВСТАВЬТЕ СЮДА ПУТЬ К ВАШЕМУ СКРИНШОТУ -->
        <img src="Figma.png" alt="Скриншот макета Desktop" class="screenshot">
    </div>
</body>
</html>
