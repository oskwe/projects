<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab 6 - Task 8: Погода с кэшем</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 { text-align: center; color: #333; font-size: 1.5rem; }

        .widget {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .weather-result {
            display: none; /* Скрыто по умолчанию */
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .weather-result.visible { display: block; }

        .city-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .data-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .data-label {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 5px;
            display: block;
        }

        .data-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .source-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .source-api { background-color: #007bff; }
        .source-cache { background-color: #28a745; }

        .error-msg {
            color: #dc3545;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .error-msg.visible { display: block; }

        .loading {
            text-align: center;
            color: #007bff;
            margin-top: 10px;
            display: none;
        }
        .loading.visible { display: block; }
    </style>
</head>
<body>

    <h1>Погода в городе</h1>

    <div class="widget">
        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Введите город (напр. Moscow)" value="Moscow">
            <button id="searchBtn">Найти</button>
        </div>

        <div id="loading" class="loading">Загрузка данных...</div>
        <div id="errorMsg" class="error-msg"></div>

        <div id="weatherResult" class="weather-result">
            <div class="city-title" id="resCity">Город</div>
            
            <div class="data-grid">
                <div class="data-item">
                    <span class="data-label">Температура</span>
                    <span class="data-value" id="resTemp">--°C</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Погода</span>
                    <span class="data-value" id="resDesc">--</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Ветер (скорость)</span>
                    <span class="data-value" id="resWindSpeed">-- м/с</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Ветер (направление)</span>
                    <span class="data-value" id="resWindDir">--</span>
                </div>
            </div>

            <div id="sourceBadge" class="source-badge"></div>
            <div style="margin-top: 10px; font-size: 0.8rem; color: #999; text-align: center;">
                Данные актуальны до: <span id="cacheExpiry"></span>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('errorMsg');
        const resultBlock = document.getElementById('weatherResult');
        
        // Элементы вывода
        const resCity = document.getElementById('resCity');
        const resTemp = document.getElementById('resTemp');
        const resDesc = document.getElementById('resDesc');
        const resWindSpeed = document.getElementById('resWindSpeed');
        const resWindDir = document.getElementById('resWindDir');
        const sourceBadge = document.getElementById('sourceBadge');
        const cacheExpiry = document.getElementById('cacheExpiry');

        const CACHE_DURATION = 10 * 60 * 1000; // 10 минут в миллисекундах
        const STORAGE_PREFIX = 'weather_cache_';

        // Коды погоды WMO (интерпретация)
        function getWeatherDescription(code) {
            const codes = {
                0: "Ясно",
                1: "Преимущественно ясно",
                2: "Переменная облачность",
                3: "Пасмурно",
                45: "Туман", 48: "Иней",
                51: "Морось", 53: "Морось", 55: "Сильная морось",
                61: "Дождь", 63: "Дождь", 65: "Сильный дождь",
                71: "Снег", 73: "Снег", 75: "Сильный снег",
                95: "Гроза", 96: "Гроза с градом", 99: "Сильная гроза с градом"
            };
            return codes[code] || "Неизвестно";
        }

        function getWindDirection(degrees) {
            const directions = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
            const index = Math.round(degrees / 45) % 8;
            return directions[index];
        }

        async function fetchWeather() {
            const city = cityInput.value.trim();
            if (!city) {
                showError("Введите название города");
                return;
            }

            // UI сброс
            showError("");
            resultBlock.classList.remove('visible');
            loadingEl.classList.add('visible');
            searchBtn.disabled = true;

            const storageKey = STORAGE_PREFIX + city.toLowerCase();
            const now = Date.now();

            try {
                // 1. Проверка кэша
                const cachedData = localStorage.getItem(storageKey);
                
                if (cachedData) {
                    const parsed = JSON.parse(cachedData);
                    // Проверяем актуальность
                    if (now - parsed.timestamp < CACHE_DURATION) {
                        // Кэш валиден
                        renderWeather(parsed.data, city, true);
                        loadingEl.classList.remove('visible');
                        searchBtn.disabled = false;
                        return;
                    }
                }

                // 2. Если кэша нет или он устарел -> Запрос к API
                
                // Шаг А: Геокодинг (получение координат по имени города)
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ru&format=json`;
                const geoRes = await fetch(geoUrl);
                
                if (!geoRes.ok) throw new Error("Ошибка поиска города");
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error("Город не найден. Попробуйте ввести название на английском (например, Moscow, London).");
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                // Шаг Б: Получение погоды по координатам
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&timezone=auto`;
                const weatherRes = await fetch(weatherUrl);

                if (!weatherRes.ok) throw new Error("Ошибка получения погоды");
                const weatherData = await weatherRes.json();

                const current = weatherData.current;
                
                // Формируем объект данных для сохранения
                const resultData = {
                    temp: current.temperature_2m,
                    code: current.weather_code,
                    windSpeed: current.wind_speed_10m,
                    windDir: current.wind_direction_10m,
                    country: country
                };

                // Сохраняем в кэш
                const cacheObject = {
                    data: resultData,
                    timestamp: now
                };
                localStorage.setItem(storageKey, JSON.stringify(cacheObject));

                // Отображаем
                renderWeather(resultData, `${name}, ${country}`, false);

            } catch (error) {
                showError(error.message);
            } finally {
                loadingEl.classList.remove('visible');
                searchBtn.disabled = false;
            }
        }

        function renderWeather(data, cityName, isFromCache) {
            resCity.textContent = cityName;
            resTemp.textContent = `${Math.round(data.temp)}°C`;
            resDesc.textContent = getWeatherDescription(data.code);
            resWindSpeed.textContent = `${data.windSpeed} м/с`;
            resWindDir.textContent = getWindDirection(data.windDir);

            // Настройка бейджа источника
            if (isFromCache) {
                sourceBadge.textContent = "Источник: LocalStorage (Кэш)";
                sourceBadge.className = "source-badge source-cache";
            } else {
                sourceBadge.textContent = "Источник: API (Свежие данные)";
                sourceBadge.className = "source-badge source-api";
            }

            // Расчет времени истечения кэша
            const stored = localStorage.getItem(STORAGE_PREFIX + cityName.split(',')[0].toLowerCase()); // грубо, но для демо пойдет
            // Лучше взять текущее время + 10 мин, если только что загрузили, или распарсить если из кэша
            // Для простоты покажем время жизни с момента текущего запроса/чтения
            const expiryTime = new Date(Date.now() + CACHE_DURATION);
            cacheExpiry.textContent = expiryTime.toLocaleTimeString('ru-RU');

            resultBlock.classList.add('visible');
        }

        function showError(msg) {
            errorEl.textContent = msg;
            if (msg) errorEl.classList.add('visible');
            else errorEl.classList.remove('visible');
        }

        // Обработчики
        searchBtn.addEventListener('click', fetchWeather);
        cityInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchWeather();
        });

    </script>
</body>
</html>
