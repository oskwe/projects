<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab 6 - Task 5: Галерея избранного</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1, h2 { text-align: center; color: #333; }

        /* Блок управления */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
        }

        .radio-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 16px;
        }

        .radio-group label { cursor: pointer; }
        .radio-group input { margin-right: 5px; transform: scale(1.2); }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-load { background-color: #007bff; color: white; }
        .btn-load:hover { background-color: #0056b3; }
        .btn-load:disabled { background-color: #ccc; cursor: not-allowed; }

        .btn-fav { background-color: #ffc107; color: #333; }
        .btn-fav:hover { background-color: #e0a800; }
        .btn-fav:disabled { background-color: #eee; color: #aaa; cursor: not-allowed; opacity: 0.7; }

        .status {
            margin-top: 10px;
            font-weight: bold;
            min-height: 24px;
        }
        .status.error { color: #dc3545; }
        .status.success { color: #28a745; }
        .status.loading { color: #007bff; }

        /* Область предпросмотра */
        .preview-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none; /* Скрыто по умолчанию */
        }

        .placeholder-text { color: #aaa; font-style: italic; }

        /* Галерея избранного */
        .gallery-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .btn-clear {
            background-color: #dc3545;
            color: white;
            font-size: 14px;
            padding: 6px 12px;
        }
        .btn-clear:hover { background-color: #c82333; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #fafafa;
            transition: transform 0.2s;
            position: relative;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .item-info {
            padding: 10px;
            font-size: 12px;
            color: #555;
        }

        .item-date {
            display: block;
            margin-bottom: 5px;
            font-style: italic;
        }

        .btn-remove {
            width: 100%;
            padding: 5px;
            background-color: #dc3545;
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-remove:hover { background-color: #c82333; }

        .empty-gallery {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Галерея: Собчаков и кошаков</h1>

    <!-- Управление -->
    <div class="controls">
        <div class="radio-group">
            <label>
                <input type="radio" name="animal" value="dog" checked> Собчак
            </label>
            <label>
                <input type="radio" name="animal" value="cat"> Кошак
            </label>
        </div>

        <div class="action-buttons">
            <button id="loadBtn" class="btn-load">Загрузить изображение</button>
            <button id="favBtn" class="btn-fav" disabled>Добавить в избранное</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <!-- Предпросмотр -->
    <div class="preview-area">
        <span id="placeholder" class="placeholder-text">Здесь появится загруженное изображение</span>
        <img id="previewImg" src="" alt="Предпросмотр">
    </div>

    <!-- Избранное -->
    <div class="gallery-section">
        <div class="gallery-header">
            <h2>Избранное (<span id="countLabel">0</span>)</h2>
            <button id="clearBtn" class="btn-clear">Очистить всё</button>
        </div>
        <div id="galleryGrid" class="gallery-grid">
            <!-- Сюда JS добавит картинки -->
        </div>
    </div>

    <script>
        "use strict";

        // Элементы DOM
        const loadBtn = document.getElementById('loadBtn');
        const favBtn = document.getElementById('favBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusEl = document.getElementById('status');
        const previewImg = document.getElementById('previewImg');
        const placeholder = document.getElementById('placeholder');
        const galleryGrid = document.getElementById('galleryGrid');
        const countLabel = document.getElementById('countLabel');

        // Константы API
        const API_DOG = 'https://dog.ceo/api/breeds/image/random';
        const API_CAT = 'https://api.thecatapi.com/v1/images/search';
        
        // Ключ localStorage
        const STORAGE_KEY = 'favoritesGallery';

        // Текущее состояние
        let currentImageUrl = null;

        // --- Функции работы с LocalStorage ---

        function getFavorites() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        function saveFavorites(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        function renderGallery() {
            const favorites = getFavorites();
            galleryGrid.innerHTML = '';
            countLabel.textContent = favorites.length;

            if (favorites.length === 0) {
                galleryGrid.innerHTML = '<div class="empty-gallery">Галерея пуста. Добавьте первое изображение!</div>';
                return;
            }

            // Рендерим от новых к старым (reverse не делаем, так как добавляем unshift, но если хотим хронологию добавления - оставим как есть)
            // В задании не указан порядок, пусть новые будут первыми (так как мы используем unshift при добавлении)
            
            favorites.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-item';
                
                card.innerHTML = `
                    <img src="${item.url}" alt="Избранное ${index + 1}" loading="lazy">
                    <div class="item-info">
                        <span class="item-date">${item.date}</span>
                        <button class="btn-remove" data-index="${index}">Удалить</button>
                    </div>
                `;
                galleryGrid.appendChild(card);
            });
        }

        function addToFavorites(url) {
            if (!url) return;

            const now = new Date();
            const formattedDate = now.toLocaleString('ru-RU');

            const favorites = getFavorites();
            
            // Добавляем в начало массива
            favorites.unshift({
                url: url,
                date: formattedDate,
                timestamp: now.getTime()
            });

            saveFavorites(favorites);
            renderGallery();
            
            showStatus('Добавлено в избранное!', 'success');
        }

        function removeFromFavorites(index) {
            const favorites = getFavorites();
            if (index >= 0 && index < favorites.length) {
                favorites.splice(index, 1);
                saveFavorites(favorites);
                renderGallery();
            }
        }

        function clearFavorites() {
            if (confirm('Вы уверены, что хотите очистить всю галерею?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderGallery();
            }
        }

        // --- Логика загрузки изображения ---

        async function loadImage() {
            // Сброс UI
            statusEl.textContent = 'Загружается...';
            statusEl.className = 'status loading';
            loadBtn.disabled = true;
            favBtn.disabled = true;
            previewImg.style.display = 'none';
            placeholder.style.display = 'block';
            currentImageUrl = null;

            // Определяем выбранное животное
            const animalType = document.querySelector('input[name="animal"]:checked').value;
            const url = animalType === 'dog' ? API_DOG : API_CAT;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000);

            try {
                const response = await fetch(url, { signal: controller.signal });
                
                if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);
                
                const data = await response.json();
                
                // Извлекаем URL в зависимости от API
                let imageUrl = '';
                if (animalType === 'dog') {
                    imageUrl = data.message;
                } else {
                    if (data && data.length > 0) imageUrl = data[0].url;
                }

                if (!imageUrl) throw new Error('Пустой ответ от API');

                // Предзагрузка картинки браузером
                const imgLoader = new Image();
                imgLoader.src = imageUrl;
                
                imgLoader.onload = () => {
                    previewImg.src = imageUrl;
                    previewImg.style.display = 'block';
                    placeholder.style.display = 'none';
                    
                    currentImageUrl = imageUrl;
                    favBtn.disabled = false; // Активируем кнопку
                    statusEl.textContent = 'Изображение загружено!';
                    statusEl.className = 'status success';
                    loadBtn.disabled = false;
                };

                imgLoader.onerror = () => {
                    throw new Error('Не удалось загрузить файл изображения');
                };

            } catch (error) {
                if (error.name === 'AbortError') {
                    statusEl.textContent = 'Запрос отменён: время ожидания истекло.';
                } else {
                    statusEl.textContent = 'Не удалось загрузить картинку.';
                }
                statusEl.className = 'status error';
                loadBtn.disabled = false;
                console.error(error);
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = `status ${type}`;
            setTimeout(() => {
                if (statusEl.textContent === msg) {
                    statusEl.textContent = '';
                    statusEl.className = '';
                }
            }, 3000);
        }

        // --- Обработчики событий ---

        loadBtn.addEventListener('click', loadImage);

        favBtn.addEventListener('click', () => {
            if (currentImageUrl) {
                addToFavorites(currentImageUrl);
                // Можно оставить кнопку активной, чтобы добавить ту же картинку еще раз (если нужно), 
                // или деактивировать. Оставим активной.
            }
        });

        clearBtn.addEventListener('click', clearFavorites);

        // Делегирование для удаления отдельных элементов
        galleryGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-remove')) {
                const index = parseInt(e.target.dataset.index, 10);
                removeFromFavorites(index);
            }
        });

        // Инициализация галереи при загрузке
        window.addEventListener('DOMContentLoaded', renderGallery);

    </script>
</body>
</html>
