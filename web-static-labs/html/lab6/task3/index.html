<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab 6 - Task 3: ToDo + LocalStorage</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 { text-align: center; }

        /* Область ввода */
        .input-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        button.add-btn {
            align-self: flex-end;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button.add-btn:hover { background-color: #218838; }

        /* Область списка задач */
        #taskList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Карточка задачи */
        .task-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            position: relative;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-content {
            flex-grow: 1;
            margin-right: 15px;
            word-break: break-word;
        }

        .task-date {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
            display: block;
        }

        .task-text {
            font-size: 1.1em;
            line-height: 1.4;
        }

        /* Состояние наведения (Hover) */
        .task-item:hover {
            background-color: #e3f2fd;
            border-color: #2196f3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Кнопки действий */
        .task-actions {
            display: none;
            gap: 5px;
            flex-shrink: 0;
        }

        .task-item:hover .task-actions {
            display: flex;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }

        .btn-copy { background-color: #17a2b8; }
        .btn-copy:hover { background-color: #138496; }

        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #c82333; }

        .empty-msg {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Список задач</h1>

    <!-- Область ввода -->
    <div class="input-area">
        <textarea id="taskInput" placeholder="Введите текст новой задачи..."></textarea>
        <button id="addBtn" class="add-btn">Добавить задачу</button>
    </div>

    <!-- Область списка -->
    <div id="taskList">
        <!-- Сюда JS будет добавлять задачи -->
    </div>

    <script>
        "use strict";

        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        
        // Ключ для localStorage
        const STORAGE_KEY = 'todoListData';

        // Массив для хранения задач в памяти
        let tasks = [];

        // --- Функции работы с LocalStorage ---

        function loadTasks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    tasks = JSON.parse(stored);
                } catch (e) {
                    console.error('Ошибка чтения данных из localStorage', e);
                    tasks = [];
                }
            }
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        // --- Функции отрисовки и логики ---

        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-msg">Список задач пуст. Добавьте первую задачу!</div>';
                return;
            }

            // Отрисовываем задачи (новые сверху, так как в массиве они тоже в таком порядке)
            tasks.forEach((task, index) => {
                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';
                // Сохраняем индекс в dataset для быстрого доступа при удалении
                taskItem.dataset.index = index;

                taskItem.innerHTML = `
                    <div class="task-content">
                        <span class="task-date">${task.date}</span>
                        <div class="task-text">${escapeHtml(task.text)}</div>
                    </div>
                    <div class="task-actions">
                        <button class="action-btn btn-copy" type="button">Копировать</button>
                        <button class="action-btn btn-delete" type="button">Удалить</button>
                    </div>
                `;
                taskList.appendChild(taskItem);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            
            if (text === "") {
                alert("Пожалуйста, введите текст задачи!");
                return;
            }

            const now = new Date();
            const dateString = now.toLocaleDateString('ru-RU');
            const timeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const dateTimeStr = `${dateString} ${timeString}`;

            // Создаем объект задачи
            const newTask = {
                text: text,
                date: dateTimeStr,
                id: Date.now() // Уникальный ID на всякий случай
            };

            // Добавляем в НАЧАЛО массива (чтобы новые были сверху)
            tasks.unshift(newTask);

            // Сохраняем и перерисовываем
            saveTasks();
            renderTasks();

            // Очищаем поле
            taskInput.value = "";
            taskInput.focus();
        }

        function deleteTask(index) {
            // Удаляем один элемент по индексу
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function copyTaskText(text) {
            copyToClipboard(text);
            // Визуальное подтверждение можно добавить через alert или toast, 
            // но в задании ЛР5 мы меняли текст кнопки. Здесь сложнее найти кнопку через делегирование без event.target,
            // поэтому оставим просто копирование.
        }

        // Твоя функция копирования (из предыдущих заданий)
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand("copy");
            } catch (err) {
                console.error('Ошибка копирования: ', err);
            }
            document.body.removeChild(textarea);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Обработчики событий ---

        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                addTask();
            }
        });

        // Делегирование для кнопок внутри списка
        taskList.addEventListener('click', (event) => {
            const target = event.target;
            const taskItem = target.closest('.task-item');
            
            if (!taskItem) return;
            
            const index = parseInt(taskItem.dataset.index, 10);

            if (target.classList.contains('btn-delete')) {
                deleteTask(index);
            }

            if (target.classList.contains('btn-copy')) {
                const text = taskItem.querySelector('.task-text').textContent;
                copyTaskText(text);
                
                // Временная смена текста кнопки
                const originalText = target.textContent;
                target.textContent = "Скопировано!";
                setTimeout(() => {
                    target.textContent = originalText;
                }, 1500);
            }
        });

        // Загрузка задач при старте страницы
        window.addEventListener('DOMContentLoaded', loadTasks);

    </script>
</body>
</html>
