<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тестовый фронтенд для ЛР №7</title>
</head>
<body>
    <h1>фронтенд для ЛР №7</h1>
    <!-- Ссылки на задания -->
    <hr>
    <h3>Перейти к заданиям:</h3>
    <ul>
        <li><a href="/lab7/task1/">Задание 1: Калькулятор</a></li>
        <li><a href="/lab7/task2/">Задание 2: Форма студента</a></li>
    </ul>

    <script>
        // Функция для проверки API
        async function checkApi(url, elementId) {
            const el = document.getElementById(elementId);
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(response.statusText);
                const data = await response.json();
                el.textContent = JSON.stringify(data);
                el.style.color = 'green';
            } catch (error) {
                console.error(error);
                el.textContent = 'Ошибка! (См. консоль F12)';
                el.style.color = 'red';
            }
        }

        // Запускаем проверку при загрузке
        // Обратите внимание: пути относительные, если мы на странице /lab7/, то API будет /api/lab7/...
        // Но так как этот файл лежит в /lab7/index.html, а API в корне /api/..., 
        // лучше использовать абсолютные пути от корня домена.
        
        checkApi('/api/lab7/task1?operation=add&a=2&b=2', 'res1');
        checkApi('/api/lab7/task2', 'res2');
    </script>
</body>
</html>
