<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР8. Задание 2</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202124;
      background: #f5f7fb;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 18px;
    }

    a {
      color: #174ea6;
    }

    h1 {
      margin: 18px 0 20px;
      font-size: 28px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    button {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid #b8c2d6;
      border-radius: 6px;
      background: #fff;
      color: #174ea6;
      font: inherit;
      cursor: pointer;
    }

    button.active {
      background: #174ea6;
      color: #fff;
      border-color: #174ea6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    article {
      padding: 18px;
      border: 1px solid #d8dee9;
      border-radius: 8px;
      background: #fff;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .message {
      padding: 18px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #d8dee9;
    }
  </style>
</head>
<body>
  <main>
    <a href="/lab8/">Назад к ЛР8</a>
    <h1>Задание 2. Группы и стадионы</h1>

    <div class="tabs">
      <button type="button" class="active" data-mode="groups">Группы</button>
      <button type="button" data-mode="stadiums">Стадионы</button>
    </div>

    <div id="content" class="message">Загрузка...</div>
  </main>

  <script>
    const content = document.getElementById('content');
    const buttons = document.querySelectorAll('button[data-mode]');

    function renderMatch(match) {
      return `${match.date} ${match.time}: ${match.team1} ${match.score} ${match.team2}, ${match.stadium}`;
    }

    function renderGroups(groups) {
      content.className = 'grid';
      content.innerHTML = groups.map((group) => `
        <article>
          <h2>${group.group}</h2>
          <p>${group.teams.join(', ')}</p>
          <ul>${group.matches.map((match) => `<li>${renderMatch(match)}</li>`).join('')}</ul>
        </article>
      `).join('');
    }

    function renderStadiums(stadiums) {
      content.className = 'grid';
      content.innerHTML = stadiums.map((item) => `
        <article>
          <h2>${item.stadium}</h2>
          <ul>${item.matches.map((match) => `<li>${match.group}: ${match.date} ${match.time}, ${match.team1} ${match.score} ${match.team2}</li>`).join('')}</ul>
        </article>
      `).join('');
    }

    async function load(mode) {
      content.className = 'message';
      content.textContent = 'Загрузка...';
      const response = await fetch(mode === 'groups' ? '/api/lab8/task2/groups' : '/api/lab8/task2/stadiums');
      const data = await response.json();
      if (!response.ok) {
        content.textContent = data.message || 'Ошибка загрузки данных';
        return;
      }
      mode === 'groups' ? renderGroups(data) : renderStadiums(data);
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        buttons.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        load(button.dataset.mode);
      });
    });

    load('groups');
  </script>
</body>
</html>
