services:
  backend:
    build:
      context: .
    container_name: local-examples-backend-server
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ./public:/app/public
      - /app/backend/node_modules
    env_file:
      - ./backend/.env.local
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://devuser:devpass@db:5432/devdb
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: local-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    container_name: local-adminer-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data_volume:
