{% if field.field.widget.input_type == 'checkbox' %}<div class="input-field"><label>{{ field }}<span>{{ field.label }}</span></label>{{ field.errors }}</div>{% else %}<div class="input-field{% if wide %} span-2{% endif %}">{{ field }}<label class="active" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="red-text" aria-hidden="true">*</span>{% endif %}</label>{{ field.errors }}{% if field.help_text %}<span class="helper-text">{{ field.help_text }}</span>{% endif %}</div>{% endif %}
