{% extends 'base.html' %}
{% block title %}Удалить склад{% endblock %}

{% block content %}
<h4>Удалить склад?</h4>
<form method="post">
  {% csrf_token %}
  <p>Вы уверены, что хотите удалить "{{ object.name }}"?</p>
  <button class="btn red">Удалить</button>
  <a href="{% url 'warehouses:list' %}" class="btn grey">Отмена</a>
</form>
{% endblock %}
